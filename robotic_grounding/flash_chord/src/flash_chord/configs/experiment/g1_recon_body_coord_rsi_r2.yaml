# @package _global_

# Arm C3-wide round 2 (C3r2): exactly arm C3-wide (experiment/g1_recon_body_coord_rsi_wide.yaml: W0-P coordinated
# learner with the Coordinates_hand-size actor + RSI v3 (fixed) reset/curriculum, FlashCHORD VOC) with
# Coordinates_hand's RSI v3 TIMERS CONVERTED BY SAMPLES, a 45k-iteration cap, Coordinates_hand's early stop and
# Coordinates_hand's OBJECT TASK REWARD (below). Nothing else differs (tests/coordinate/test_experiment_configs.py
# fails on any other difference).
#
# Object task reward (added on top of the twelve stock ReconBody terms; objectives/recon_body.py term `object_task`):
#   object_task = exp(-object_task_position_beta * |p - p_ref|) * exp(-object_task_rotation_beta * angle(q, q_ref))
# on the object root body against the same per-world targets as object_position, |.| in metres (not squared),
# angle = 2 asin(|vec(q conj(q_ref))|) in radians; score += frame_dt * 5.0 * object_task (CH dexmachina/envs/rewards.py
# compute_task_reward, multiply_task_rew; its articulation factor is exactly 1 for the rigid Track 2 objects).
#   Weight 5.0 lives in TWO places, both set by the paired group files below: objective/recon_body_objtask.yaml
#     (object_task_weight != 0 creates the term) and curriculum/recon_body_rsi_objtask.yaml (the stage weight training
#     applies every iteration). Only one of them set fails at the first iteration.
#   Betas 10 per metre / 1 per radian: what CH actually trained with. CH's get_reward_cfg() says 20/5, but
#     dexmachina/envs/constructors.py:111-115 always overwrites them from --task_rew_betas (default [10, 1, 5],
#     constructors.py:379), and CH's launchers pass `--task_rew_betas 10 1 5` (dexmachina/ablation/config.py:111).
#     They are set explicitly in `objective:` below (over the group file's 20/5), so the checkpoint config records them.
#     At 10/1 the term is 0.74 at 3 cm and 0.61 at 0.5 rad. frame_dt 0.02: up to +0.10 per step on top of the stock
#     positive maximum of 0.32; the termination penalty (-300 x 0.02) is unchanged.
#   E2 export strips the three object_task_* objective fields and the curriculum weight (the official runtime would
#     reject them); the exported actor and its stock config are unaffected.
#
# Sample conversion. One Coordinates_hand (CH) update is taken as 12000 envs x 32 steps = 384,000 samples: that is
# CH's A1 / W0-P recipe (dexmachina/ablation/config.py:89-97: num_envs 12000, effective horizon_length 32). It is an
# ASSUMPTION for CH's RSI runs - their launch flags are not on disk (plans/voc_decay_comparison.md, "inferred: A1
# recipe"); had they used e.g. 4096 envs the factor would be ~1.33 and these timers ~2.9x too slow. One FlashCHORD
# PPO iteration = 4096 worlds x 24 steps = 98,304 samples; factor 384,000 / 98,304 = 3.90625 iterations per update.
# Timers in CH updates (CH curriculum.py RSI_DEFAULTS; CH's fixed runs' flags are not on disk) -> our iterations:
#   reset.wait_iterations   CH 100   -> 391     (390.6)
#   reset.min_gap           CH 40    -> 156     (156.25)
#   reset.deadline          CH 9000  -> 35156   (35,156.25)
#   reset.zero_ramp         CH 1000  -> 3906    (3,906.25)   every bin at zero help by iteration 39,062
#   training.early_stop_help_zero_tail  CH 1500 (rl_games "zero gains for 1500 epochs") -> 5860 (5,859.4, rounded up)
#   training.max_iterations 20000 -> 45000: the deadline forces zero help by 39,062, so every run stops early by
#     39,062 + 5,860 = 44,922; episodes that earn zero help through success stop sooner (earliest 17,171 = 391 +
#     70 x 156 + 5,860). Round-1 sidecars suggest most episodes will run to the deadline-forced stop (~44.9k).
# Checkpoint choice differs from CH: CH's primary evaluation uses its native best-training-reward checkpoint
# (dexmachina/rl/eval_rl_games.py:373-378); r2 pre-registers the FINAL checkpoint named by final.json.
# Round 1 (C3/C3-wide) used deadline 11000 + ramp 1000 and min_gap 40, wait 100 counted in iterations, i.e. CH's
# timers in update units but ~3.9x fewer samples per unit. Round-1 evidence (plans/voc_decay_comparison.md;
# tmp_analysis/rsi_selfzero.py): in 11 of 30 episodes help reached zero only because the deadline forced it -
# their start bins sat on the deadline floor all the way down - and with help off they still failed 71-95% of
# episodes: they never learned to hold the object. Matching CH per sample gives every bin ~3.9x the samples per
# success decision and the same total sample budget CH had to earn zero help.
# Everything else in reset/recon_body_rsi.yaml is unchanged (bin_frames 25, band 2, step 0.9, thresholds .8/.4,
# min_count 64, zero_below 6.25e-4, keyframes, frame0_share 0.25, kf_*). The curriculum is
# curriculum/recon_body_rsi_objtask.yaml = curriculum/recon_body_rsi.yaml (C3-wide's) plus `object_task: 5.0` and
# nothing else: one stage (voc 0; RSI owns help), and stage_index clamps to the last stage, so its 20000 threshold
# sentinel selects the same stage at every iteration up to 45000 (identical semantics).

defaults:
  - override /sim: recon_body
  - override /collision: physical
  - override /embodiment: g1_dex3
  - override /action: sonic_joint_residual
  - override /observation: recon_body
  - override /objective: recon_body_objtask         # C3-wide: recon_body. + object_task (weight 5.0)
  - override /termination: recon_body
  - override /reset: recon_body_rsi
  - override /curriculum: recon_body_rsi_objtask    # C3-wide: recon_body_rsi. + object_task: 5.0 in its one stage

# CH object task betas as CH trained (header): 10 per metre, 1 per radian. The weight (5.0) comes from the paired
# group files above; objective/recon_body_objtask.yaml's 20/5 are CH's get_reward_cfg() values, not what CH ran.
objective:
  object_task_position_beta: 10.0
  object_task_rotation_beta: 1.0

# CH RSI v3 timers converted by samples (header). The other reset fields come from reset/recon_body_rsi.yaml.
reset:
  wait_iterations: 391
  min_gap: 156
  deadline: 35156
  zero_ramp: 3906

task:
  motion_speed: 1.0
  source_frame_playback: true
  motion_start_frame: 0
  motion_end_frame: -1

scene:
  world_count: 4096
  contact_friction: 1.0
  object_free_joint_damping: 0.01

action:
  input_mode: raw
  normalized_mapping: linear

env:
  voc:
    _target_: flash_chord.runtime.object_control.VOCParams
    k_lin: 50.0
    d_lin: 10.0
    k_ang: 10.0
    d_ang: 0.1
    max_force: 60.0
    max_torque: 60.0
    gravity: 9.81
    mass_normalized_gains: false
  contact:
    _target_: flash_chord.runtime.contact.ContactTrackerConfig
    sides: [left, right]
  capture_terminal_state: false
  enforce_joint_velocity_limits: true
  critic_context:
    _target_: flash_chord.envs.rl.CriticContextConfig
    reference_phase: false
    object_body_velocity: false

# Match G1SonicRslRlPpoCfg, then retain both deployment-exact and uniform
# recovery starts through the terminal checkpoint.
training:
  rollout_steps: 24
  max_iterations: 45000
  # CH early stop: after 5860 iterations (= 1500 CH updates) with every RSI start bin at zero help (final.json).
  early_stop_help_zero_tail: 5860
  save_interval: 500
  observation_normalization: true
  observation_normalization_epsilon: 0.01
  reward_normalization: false
  resume: false
  checkpoint: null
  network:
    actor_hidden_dims: [1024, 512, 256, 128]
    critic_hidden_dims: [1024, 512, 256, 128]
    activation: elu
    initial_noise_std: 0.5
    noise_std_type: scalar
    actor_output_gain: 0.0
  ppo:
    value_loss_coefficient: 1.0
    use_clipped_value_loss: true
    clip_parameter: 0.2
    entropy_coefficient: 0.0005
    learning_epochs: 5
    mini_batches: 4
    learning_rate: 0.0005
    schedule: adaptive
    minimum_learning_rate: 0.00001
    maximum_learning_rate: 0.01
    adaptive_schedule_factor: 1.5
    discount: 0.99
    gae_lambda: 0.95
    desired_kl: 0.02
    max_grad_norm: 0.1
    normalize_advantage_per_mini_batch: false
    log_ratio_clip: null

  # W0-P coordinated learner (docs/coord_impl_spec.md section 3.1). Every
  # CoordinateConfig field is explicit. The coordinated actor ignores
  # network.actor_hidden_dims; the K-column central critic uses
  # network.critic_hidden_dims. Export (E2) embeds the actor into the plain
  # [1024, 1024, 768, 384] MLP named by export_actor_hidden_dims (uses
  # [640, 576, 768, 384] of it). Only encoder_dim, trunk_dims and
  # export_actor_hidden_dims differ from C3.
  coordinate:
    _target_: flash_chord.training.ppo.config.CoordinateConfig
    agents: [left, right, body]
    encoder_dim: 128
    partner_dim: 64
    message_dim: 64
    trunk_dims: [256, 128]
    partner_message: true
    mirror_body_message: true
    hand_world_terms: reflect
    ratio_mode: per_agent
    value_mode: per_agent
    export_actor_hidden_dims: [1024, 1024, 768, 384]

logging:
  experiment: g1_sonic_recon_body_coord_rsi_r2
  run_name: g1_recon_body_coord_rsi_r2
  log_interval: 10
