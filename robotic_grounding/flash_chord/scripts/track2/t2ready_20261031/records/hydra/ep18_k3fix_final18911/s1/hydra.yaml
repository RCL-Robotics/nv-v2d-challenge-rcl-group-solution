hydra:
  run:
    dir: /root/autodl-tmp/haoran.zhang/fc_runs/C3r2_tier2_k3fix/ep18_k3fix_s42/hydra
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=/root/autodl-tmp/haoran.zhang/fc_runs/C3r2_tier2_k3fix/ep18_k3fix_s42/hydra
    - hydra.mode=RUN
    task:
    - experiment=g1_recon_body_coord_rsi_r2
    - task.parquet='/root/autodl-tmp/haoran.zhang/data/human_motion_data_tier2_k3fix/whole_body/soma/sequence_id=2026-05-06_10-00-19_blue_trash_can_drag_sideways_08/robot_name=g1/data.parquet'
    - reset.seed=42
    - output_dir=/root/autodl-tmp/haoran.zhang/fc_runs/C3r2_tier2_k3fix/ep18_k3fix_s42
    - training.max_iterations=45000
    - logging.mode=offline
    - logging.entity=juicer_test
    - logging.project=v2d-track2-tier2
    - logging.experiment=C3r2_tier2_k3fix
    - logging.run_name=ep18_blue_trash_can
    - logging.upload_checkpoints=false
    - scene.support=false
    - +logging.local_jsonl=true
  job:
    name: train_rl
    chdir: false
    override_dirname: +logging.local_jsonl=true,experiment=g1_recon_body_coord_rsi_r2,logging.entity=juicer_test,logging.experiment=C3r2_tier2_k3fix,logging.mode=offline,logging.project=v2d-track2-tier2,logging.run_name=ep18_blue_trash_can,logging.upload_checkpoints=false,output_dir=/root/autodl-tmp/haoran.zhang/fc_runs/C3r2_tier2_k3fix/ep18_k3fix_s42,reset.seed=42,scene.support=false,task.parquet='/root/autodl-tmp/haoran.zhang/data/human_motion_data_tier2_k3fix/whole_body/soma/sequence_id=2026-05-06_10-00-19_blue_trash_can_drag_sideways_08/robot_name=g1/data.parquet',training.max_iterations=45000
    id: ???
    num: ???
    config_name: train
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /root/autodl-tmp/haoran.zhang/code/fc_r2
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /root/autodl-tmp/haoran.zhang/code/fc_r2/src/flash_chord/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /root/autodl-tmp/haoran.zhang/fc_runs/C3r2_tier2_k3fix/ep18_k3fix_s42/hydra
    choices:
