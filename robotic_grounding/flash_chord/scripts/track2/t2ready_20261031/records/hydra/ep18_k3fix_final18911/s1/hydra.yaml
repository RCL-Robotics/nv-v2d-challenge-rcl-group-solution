      training: reference_ppo
      logging: wandb
      curriculum: recon_body_rsi_objtask
      env: rl
      reset: recon_body_rsi
      termination: recon_body
      objective: recon_body_objtask
      observation: recon_body
      action: sonic_joint_residual
      embodiment: g1_dex3
      collision: physical
      scene: train
      sim: recon_body
      task: default
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
